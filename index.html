<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des voitures</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
    h1 { border-bottom: 3px solid #f0c030; padding-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    input { padding: 6px; }
    button { padding: 6px 10px; cursor: pointer; }
    #message { margin-top: 12px; font-weight: bold; }
    .error { color: #c00; }
    .ok { color: #080; }
    [hidden] { display: none !important; }
    #login-form { display: flex; gap: 8px; margin: 0; }
    #auth { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; background: #f5f5f5; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Gestion des voitures</h1>

  <!-- Exo 2 : bloc de connexion (récupère et utilise le jeton d'accès) -->
  <div id="auth">
    <form id="login-form">
      <input id="username" placeholder="Utilisateur" value="admin" required>
      <input id="password" type="password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
    <span id="auth-status">Non connecté : lecture seule</span>
    <button type="button" id="logout-btn" hidden>Se déconnecter</button>
  </div>

  <!-- Exo 1 : formulaire pour ajouter (POST) ou remplacer (PUT) -->
  <h2 id="form-title">Ajouter une voiture</h2>
  <form id="product-form">
    <input type="hidden" id="id">
    <input id="nom" placeholder="Modèle (ex : BMW Série 5)" required>
    <input id="categorie" placeholder="Catégorie (SUV, Berline...)" required>
    <input id="description" placeholder="Description">
    <input id="prix" type="number" step="0.01" min="0" placeholder="Prix (€)" required>
    <button type="submit" id="submit-btn">Ajouter</button>
    <button type="button" id="cancel-btn" hidden>Annuler</button>
  </form>

  <div id="message"></div>

  <!-- Exo 1 : liste des produits (GET) avec les actions par ligne -->
  <h2>Liste des voitures</h2>
  <table>
    <thead>
      <tr><th>ID</th><th>Nom</th><th>Description</th><th>Prix</th><th>Catégorie</th><th>Actions</th></tr>
    </thead>
    <tbody id="products"></tbody>
  </table>

  <script>
    const API = '/products';
    const form = document.getElementById('product-form');
    const fields = ['id', 'nom', 'description', 'prix', 'categorie'];
    const $ = id => document.getElementById(id);
    // Exo 2 : jeton d'accès gardé en mémoire
    let token = null;
    let tokenExpiresAt = 0;
    let timer = null;

    function showMessage(text, isError = false) {
      $('message').textContent = text;
      $('message').className = isError ? 'error' : 'ok';
    }

    // Envoie une requête JSON à l'API
    // Exo 2 : ajoute le jeton dans l'en-tête Authorization s'il existe
    async function request(method, url, body) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(url, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined
      });
      const data = res.status === 204 ? null : await res.json();
      if (res.status === 401 && token) logout();
      if (!res.ok) throw new Error(`${res.status} - ${data.message}${data.errors ? ' : ' + data.errors.join(', ') : ''}`);
      return { status: res.status, data };
    }

    // Exo 1 - Lister : GET /products
    async function loadProducts() {
      const { data } = await request('GET', API);
      const tbody = $('products');
      tbody.innerHTML = '';
      data.forEach(p => {
        const tr = document.createElement('tr');
        [p.id, p.nom, p.description, p.prix.toFixed(2) + ' €', p.categorie].forEach(v => {
          const td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        });
        const actions = document.createElement('td');
        actions.append(
          button('Voir', () => viewProduct(p.id)),
          button('Modifier', () => editProduct(p)),
          button('Promo -10%', () => discount(p)),
          button('Supprimer', () => deleteProduct(p.id))
        );
        tr.appendChild(actions);
        tbody.appendChild(tr);
      });
    }

    function button(label, onClick) {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = onClick;
      return b;
    }

    // Exo 1 - Consulter : GET /products/:id
    async function viewProduct(id) {
      try {
        const { status, data } = await request('GET', `${API}/${id}`);
        showMessage(`${status} - ${JSON.stringify(data)}`);
      } catch (e) { showMessage(e.message, true); }
    }

    // Exo 1 - Remplacer : prépare le formulaire pour un PUT
    function editProduct(p) {
      fields.forEach(f => $(f).value = p[f]);
      $('form-title').textContent = `Remplacer le produit #${p.id}`;
      $('submit-btn').textContent = 'Enregistrer';
      $('cancel-btn').hidden = false;
    }

    function resetForm() {
      form.reset();
      $('id').value = '';
      $('form-title').textContent = 'Ajouter une voiture';
      $('submit-btn').textContent = 'Ajouter';
      $('cancel-btn').hidden = true;
    }

    // Exo 1 - Modifier : PATCH /products/:id (uniquement le prix)
    async function discount(p) {
      try {
        const prix = Math.round(p.prix * 0.9 * 100) / 100;
        const { status } = await request('PATCH', `${API}/${p.id}`, { prix });
        showMessage(`${status} - Prix de "${p.nom}" modifié`);
        loadProducts();
      } catch (e) { showMessage(e.message, true); }
    }

    // Exo 1 - Supprimer : DELETE /products/:id
    async function deleteProduct(id) {
      if (!confirm('Supprimer ce produit ?')) return;
      try {
        const { status } = await request('DELETE', `${API}/${id}`);
        showMessage(`${status} - Produit supprimé`);
        loadProducts();
      } catch (e) { showMessage(e.message, true); }
    }

    // Exo 1 - Ajouter (POST /products) ou remplacer (PUT /products/:id)
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const product = {
        nom: $('nom').value,
        description: $('description').value,
        prix: parseFloat($('prix').value),
        categorie: $('categorie').value
      };
      const id = $('id').value;
      try {
        const { status } = id
          ? await request('PUT', `${API}/${id}`, product)
          : await request('POST', API, product);
        showMessage(`${status} - Produit ${id ? 'remplacé' : 'ajouté'}`);
        resetForm();
        loadProducts();
      } catch (err) { showMessage(err.message, true); }
    });

    $('cancel-btn').onclick = resetForm;

    // Exo 2 - Connexion : POST /auth/login, récupère le jeton d'accès
    $('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      try {
        const { status, data } = await request('POST', '/auth/login', {
          username: $('username').value,
          password: $('password').value
        });
        token = data.token;
        tokenExpiresAt = Date.now() + data.expiresIn * 1000;
        $('password').value = '';
        $('login-form').hidden = true;
        $('logout-btn').hidden = false;
        updateAuthStatus();
        timer = setInterval(updateAuthStatus, 1000);
        showMessage(`${status} - Connecté`);
      } catch (err) { showMessage(err.message, true); }
    });

    // Exo 2 - Expiration : affiche le temps restant (5 min) et déconnecte à 0
    function updateAuthStatus() {
      const remaining = Math.max(0, Math.round((tokenExpiresAt - Date.now()) / 1000));
      if (remaining === 0) {
        logout();
        showMessage('Jeton expiré, reconnecte-toi', true);
        return;
      }
      const min = Math.floor(remaining / 60);
      const sec = String(remaining % 60).padStart(2, '0');
      $('auth-status').textContent = `Connecté en tant que ${$('username').value}, jeton valable encore ${min}:${sec}`;
    }

    // Exo 2 - Déconnexion : oublie le jeton, retour en lecture seule
    function logout() {
      token = null;
      clearInterval(timer);
      $('login-form').hidden = false;
      $('logout-btn').hidden = true;
      $('auth-status').textContent = 'Non connecté : lecture seule';
    }

    $('logout-btn').onclick = logout;

    loadProducts();
  </script>
</body>
</html>
